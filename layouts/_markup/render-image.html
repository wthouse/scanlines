{{- /* Image render hook: lazy-load markdown images. Emits a plain <img> (not a
       <figure>) so the output is valid whether the image is inline or a
       standalone block — Goldmark wraps standalone images in <p>, and a <figure>
       inside <p> is invalid. The CRT grayscale treatment is applied via CSS;
       use Hugo's built-in `figure` shortcode when you want a visible caption. */ -}}
{{- $alt := .Text | default .PlainText -}}
<img src="{{ .Destination }}" alt="{{ $alt }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
