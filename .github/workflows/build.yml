name: Build exampleSite

# Enforces the CONTRIBUTING.md rule that the exampleSite builds cleanly with no
# warnings on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  # Lets the matrix be run on demand — useful when a push lands without
  # triggering a run (which can happen depending on how the push was
  # authenticated), and for re-checking against a newly released Hugo
  # without having to invent a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Guard both ends of the supported range: the floor declared in
        # theme.toml / hugo.toml, and whatever Hugo just released (catches new
        # deprecations early). Keep the low end in sync with min_version.
        hugo-version: ['0.146.0', 'latest']
    steps:
      - name: Checkout (named "scanlines" so themesDir ../.. resolves)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Build exampleSite, fail on any warning
        run: |
          set -euo pipefail
          hugo --source exampleSite --themesDir ../.. \
            --gc --minify --printI18nWarnings --printPathWarnings \
            --logLevel info 2>&1 | tee build.log
          if grep -qiE "WARN|deprecated" build.log; then
            echo "::error::Hugo emitted warnings — see log above"
            exit 1
          fi
          # exampleSite sets header.asciiFile, so the header must carry the
          # computed --ascii-fit. Without it the ASCII art renders at its
          # configured size and overflows narrow viewports, dragging the whole
          # document sideways — a regression that builds perfectly cleanly.
          if ! grep -qE -- '--ascii-fit:calc\(100cqi / [0-9]+\.[0-9]+\)' \
               exampleSite/public/index.html; then
            echo "::error::header is missing the computed --ascii-fit custom property"
            exit 1
          fi

      # The default config only exercises blog mode with effects on. These
      # variants render the other shipped code paths (profile header, the
      # effects-disabled branch, subpath URL handling) so a template error there
      # can't ship silently.
      - name: Build config variants
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci
          printf '[params.scanlines]\nhomepage = "profile"\n' > /tmp/ci/profile.toml
          printf '[params.scanlines.effects]\nenabled = false\n' > /tmp/ci/effects-off.toml
          printf '[params.scanlines.accessibility]\ndisableEffects = true\nhighContrast = true\n' > /tmp/ci/a11y.toml
          for variant in profile effects-off a11y; do
            echo "--- building variant: $variant ---"
            hugo --source exampleSite --themesDir ../.. \
              --config hugo.toml,/tmp/ci/$variant.toml \
              --destination /tmp/ci/out-$variant \
              --printI18nWarnings --printPathWarnings --logLevel info 2>&1 | tee variant.log
            if grep -qiE "WARN|deprecated" variant.log; then
              echo "::error::variant $variant emitted warnings"
              exit 1
            fi
          done
          echo "--- building with a subdirectory baseURL ---"
          hugo --source exampleSite --themesDir ../.. \
            --baseURL "https://example.com/blog/" \
            --destination /tmp/ci/out-subpath \
            --logLevel info 2>&1 | tee subpath.log
          if grep -qiE "WARN|deprecated" subpath.log; then
            echo "::error::subpath build emitted warnings"
            exit 1
          fi
          # Root-absolute URLs would escape the subpath — catch regressions here.
          # Accepts quoted and unquoted attributes (--minify emits href=/x), and
          # anchors the prefix match so a path merely containing "/blog/" (e.g.
          # /other/blog/x) can't slip through.
          escaped=$(grep -rhoE '(href|src)="?/[^" >]*' /tmp/ci/out-subpath --include='*.html' \
            | sed -E 's/^(href|src)="?//' \
            | grep -v '^//' | grep -vE '^/$' \
            | grep -v '^/blog/' | sort -u || true)
          if [ -n "$escaped" ]; then
            echo "::error::these URLs escape the /blog/ subpath:"; printf '%s\n' "$escaped"
            exit 1
          fi
